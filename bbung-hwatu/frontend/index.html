<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>뻥 화투 테스트</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <h1>뻥 화투 브라우저 테스트</h1>

    <div class="panel">
        <h2>로그인</h2>

        <div class="online-row">
            <input
                id="authUsername"
                type="text"
                placeholder="아이디 (3자 이상)"
                maxlength="30"
                autocomplete="username"
            >

            <input
                id="authPassword"
                type="password"
                placeholder="비밀번호 (6자 이상)"
                maxlength="100"
                autocomplete="current-password"
            >

            <input
                id="authNickname"
                type="text"
                placeholder="가입용 닉네임"
                maxlength="20"
            >
        </div>

        <div class="online-row">
            <button id="registerButton" type="button">
                회원가입
            </button>

            <button id="loginButton" type="button">
                로그인
            </button>

            <button id="logoutButton" type="button">
                로그아웃
            </button>

            <strong id="authStatus">
                로그인 안 됨
            </strong>
        </div>
    </div>

    <div class="panel">
        <label for="aiDifficultySelect">
            AI 난이도:
        </label>

        <select id="aiDifficultySelect">
            <option value="BEGINNER">
                초보
            </option>
            <option value="INTERMEDIATE">
                중수
            </option>
            <option value="ADVANCED">
                고수
            </option>
            <option value="TAZZA">
                타짜
            </option>
        </select>

        <button id="createGameButton">
            새 게임 만들기
        </button>

        <button id="refreshButton">
            상태 새로고침
        </button>

        <button
            id="drawButton"
            disabled
        >
            카드 뽑기
        </button>
    </div>

    <div class="panel">
        <h2>온라인 대전</h2>

        <div class="online-row">
            <label for="onlineNickname">
                닉네임:
            </label>
            <input
                id="onlineNickname"
                type="text"
                value="플레이어"
                maxlength="20"
            >

            <label for="onlineMaxPlayers">
                최대 인원:
            </label>
            <select id="onlineMaxPlayers">
                <option value="3">3명</option>
                <option value="4">4명</option>
                <option value="5">5명</option>
                <option value="6">6명</option>
            </select>

            <button
                id="createOnlineRoomButton"
                type="button"
            >
                온라인 방 만들기
            </button>
        </div>

        <div class="online-row">
            <label for="onlineRoomId">
                방 ID:
            </label>
            <input
                id="onlineRoomId"
                type="text"
                placeholder="ROOM-001"
            >

            <button
                id="joinOnlineRoomButton"
                type="button"
            >
                방 참가
            </button>
        </div>

        <div class="online-row">
            <label for="dealerModeSelect">
                첫 선:
            </label>
            <select id="dealerModeSelect">
                <option value="DAY">
                    낮 - 높은 월
                </option>
                <option value="NIGHT">
                    밤 - 낮은 월
                </option>
            </select>

            <button
                id="startOnlineRoomButton"
                type="button"
            >
                밤일낮짱 시작
            </button>
        </div>

        <div class="online-row">
            실시간 연결:
            <span id="realtimeStatus">
                연결 안 됨
            </span>
        </div>

        <div class="online-row">
            내 플레이어 ID:
            <span id="onlinePlayerId">
                없음
            </span>
        </div>
    </div>

    <div
        class="panel"
        id="dealerSelectionPanel"
        style="display: none;"
    >
        <h2>밤일낮짱</h2>

        <div id="dealerSelectionMode"></div>
        <div id="dealerSelectionHistory"></div>

        <button
            id="confirmOnlineStartButton"
            type="button"
            style="display: none;"
        >
            본게임 시작
        </button>
    </div>

    <div class="panel">
        <h2>게임 상태</h2>

        <div id="gameStatus">
            아직 게임이 없습니다.
        </div>
    </div>

    <div
        class="panel reaction-panel"
        id="stopPanel"
        style="display: none;"
    >
        <h2>STOP 선언</h2>

        <div class="reaction-title">
            STOP 여부는 직접 계산해서 판단하세요.
        </div>

        <button
            id="stopCallButton"
            type="button"
        >
            STOP 외치기
        </button>

        <div
            id="stopButtons"
            style="display: none;"
        ></div>
    </div>

    <div
        class="panel reaction-panel"
        id="surpriseStopPanel"
        style="display: none;"
    >
        <h2>기습 STOP</h2>

        <div class="reaction-title">
            기습 STOP 여부는 직접 계산해서 판단하세요.
        </div>

        <button
            id="surpriseStopButton"
            type="button"
        >
            기습 STOP 외치기
        </button>
    </div>

    <div
        class="panel reaction-panel"
        id="bombBagajiPanel"
        style="display: none;"
    >
        <h2>폭탄 바가지</h2>

        <div
            id="bombBagajiStatus"
            class="reaction-title"
        ></div>

        <button
            id="bombBagajiCallButton"
            type="button"
        >
            폭탄 바가지 외치기
        </button>

        <button
            id="bombBagajiCancelButton"
            type="button"
            style="display: none;"
        >
            폭탄 바가지 철회
        </button>
    </div>

    <div
        class="panel reaction-panel"
        id="generalBagajiPanel"
        style="display: none;"
    >
        <h2>일반 바가지</h2>

        <div
            id="generalBagajiStatus"
            class="reaction-title"
        ></div>

        <button
            id="generalBagajiCallButton"
            type="button"
        >
            일반 바가지 외치기
        </button>

        <button
            id="generalBagajiCancelButton"
            type="button"
            style="display: none;"
        >
            바가지 철회
        </button>
    </div>

    <div
        class="panel reaction-panel"
        id="bbungPanel"
        style="display: none;"
    >
        <h2>뻥 가능</h2>

        <div
            id="bbungMessage"
            class="reaction-title"
        ></div>

        <div>
            <strong>
                추가로 버릴 카드 선택
            </strong>
        </div>

        <div id="bbungExtraCards"></div>

        <div>
            <button
                id="bbungConfirmButton"
                disabled
            >
                뻥
            </button>

            <button id="bbungPassButton">
                넘기기
            </button>
        </div>
    </div>

    <div class="panel">
        <h2>내 손패</h2>

        <div id="myHand">
            게임을 먼저 만들어 주세요.
        </div>
    </div>

    <div
        class="panel"
        id="nextRoundPanel"
        style="display: none;"
    >
        <button
            id="nextRoundButton"
            type="button"
        >
            다음 라운드 시작
        </button>
    </div>

    <div
        class="panel"
        id="tieBreakPanel"
        style="display: none;"
    >
        <h2>최종 동점 3장 승부</h2>

        <div id="tieBreakInfo"></div>

        <button
            id="tieBreakDrawButton"
            type="button"
            disabled
        >
            승부 카드 뽑기
        </button>
    </div>

    <div
        class="panel"
        id="roundResultPanel"
        style="display: none;"
    >
        <h2>이번 판 결과</h2>
        <div id="roundResult"></div>
    </div>

    <div class="panel">
        <h2>플레이어</h2>

        <div id="players"></div>
    </div>

    <div class="panel">
        <h2>버림패</h2>

        <div id="discardPile">
            없음
        </div>
    </div>

    <div class="panel">
        <h2>메시지</h2>

        <div id="message"></div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
